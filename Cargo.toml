[package]
name = "p-usher"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Keeps unprivileged SCHED_FIFO/SCHED_RR threads off the housekeeping CPUs of a realtime Linux host"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["realtime", "preempt-rt", "affinity", "isolcpus", "daemon"]
categories = ["command-line-utilities", "os::linux-apis"]
include = ["src/**", "contrib/**", "README.md"]

[features]
default = ["email"]
email = ["dep:lettre"]

[dependencies]
anyhow = "1"
humantime = "2"
libc = "0.2"
nix = { version = "0.30", features = ["user", "hostname"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
signal-hook = "0.3"
toml = "0.9"
lettre = { version = "0.11", optional = true, default-features = false, features = ["builder", "hostname", "smtp-transport", "rustls", "ring", "rustls-native-certs"] }

[dev-dependencies]
tempfile = "3"
